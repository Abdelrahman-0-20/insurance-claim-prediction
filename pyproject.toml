[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-claims-prediction"
version = "1.0.0"
description = "Modular, config-driven insurance claims prediction with actuarial evaluation and a Streamlit app"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.3",
    "lightgbm",
    "xgboost",
    "catboost",
    "optuna",
    "shap",
    "streamlit",
    "matplotlib",
    "pyyaml",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["src", "src.data", "src.features", "src.models", "src.evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
